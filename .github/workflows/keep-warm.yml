# 本番(Render)のプロセスを温め続け、ユーザーがコールドスタート(実測 約32秒)を
# 踏む確率を下げる。$0。
#
# 経緯・注意:
#  - 当初は cron: "*/10 * * * *"(10分おき)で毎回1回pingするだけのジョブだったが、
#    実測(gh run list で過去16回分の実行時刻を確認)したところ実際の発火間隔は
#    55〜80分だった。これは GitHub Actions が高頻度cronを低活動リポジトリ向けに
#    内部的に間引く既知のベストエフォート挙動で、Render無料プランのアイドル
#    スリープ閾値より間隔が空いてしまい、コールドスタート(20秒超)を防げていなかった。
#  - そのため、GitHub側の発火頻度に依存しないよう、1回のジョブ実行の中で
#    内部ループしてURLへ5分おきにpingし続ける方式に変更した。GitHub Hosted
#    ランナーのジョブ実行時間には6時間(360分)のハード上限があるため、内部ループは
#    340分で自主的に終了し、timeout-minutes を350に設定して安全マージンを確保する。
#    concurrency で新しい発火(スケジュール or 手動)が来たら古いループ実行を
#    キャンセルして切り替えるため、ジョブが重複してスタックすることはない。
#  - これにより、GitHub側の実発火が1時間に1回程度でも、1回の発火が次の発火まで
#    (最大6時間分は)内部ループでカバーし続けるので、常時ウォームに近づく。
#  - GitHub のスケジュール実行は、リポジトリが約60日無活動だと自動停止する。
#    停止したら手動で有効化するか、UptimeRobot 等の常時監視サービス(無料)に移すとより確実。
#  - もし恒久的に温める必要が続くなら、Render 側インスタンスの常時起動(有料プランの
#    設定)や、再起動頻度(OOM 等)の見直しが本筋。これはその補助。
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分おき(実際はGitHub側で間引かれるが、内部ループでカバーする)
  workflow_dispatch:          # 手動実行も可

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping Render app repeatedly to keep it warm
        run: |
          URL="https://toris-collection.onrender.com/"
          DURATION_MINUTES=340
          INTERVAL_SECONDS=300
          END_TS=$(( $(date +%s) + DURATION_MINUTES * 60 ))

          while [ "$(date +%s)" -lt "$END_TS" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "$(date -u +%FT%TZ) ping -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::app did not return 200 (cold or down?) at $(date -u +%FT%TZ)"
            fi
            sleep "$INTERVAL_SECONDS"
          done

          echo "internal loop finished after ${DURATION_MINUTES} minutes (next scheduled/dispatched run will take over)"
