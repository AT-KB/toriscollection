# 本番(Render)のプロセスを温め続け、ユーザーがコールドスタート(実測 約32秒)を
# 踏む確率を下げる。$0。10分おきに本番URLを叩く(GitHub のスケジュールは
# ベストエフォートで数分ずれることがあるが、keep-warm 目的には十分)。
#
# 注意:
#  - GitHub のスケジュール実行は、リポジトリが約60日無活動だと自動停止する。
#    停止したら手動で有効化するか、UptimeRobot 等の常時監視サービス(無料)に移すとより確実。
#  - もし恒久的に温める必要が続くなら、Render 側インスタンスの常時起動(有料プランの
#    設定)や、再起動頻度(OOM 等)の見直しが本筋。これはその補助。
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分おき
  workflow_dispatch:          # 手動実行も可

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app to keep it warm
        run: |
          URL="https://toris-collection.onrender.com/"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "warm."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::app did not return 200 after retries (cold or down?)"
